# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is required by Jetpack Compose and all AndroidX libraries.
android.useAndroidX=true

# Generated R classes are only created for the module that declares a resource.
android.nonTransitiveRClass=true

# Kotlin language/style defaults.
kotlin.code.style=official
