name: Android CI

# Builds the real APK and fails if the APK is missing or empty.
# This workflow — not a local sandbox — is the build authority for this project.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build and verify debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android environment
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Ensure Gradle wrapper is available
        # gradle-wrapper.jar is a binary; regenerate it here so ./gradlew works
        # even in checkouts where the jar is missing.
        run: gradle wrapper --gradle-version 8.11.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK is not empty
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Inspect APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | head -n 40

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qr-payment-queue-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
