name: Android CI

# Builds the real APK and fails if the APK is missing or empty.
# This workflow — not a local sandbox — is the build authority for this project.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build and verify debug APK
    # Pinned image on purpose: `ubuntu-latest` is migrating to Ubuntu 26
    # (actions/runner-images#14748) and recent rolling images changed/dropped
    # preinstalled Android SDK pieces, which killed CI inside
    # android-actions/setup-android@v3 before Gradle ever ran (both runs
    # #1 and #2 of this workflow). ubuntu-24.04 + explicit package installs
    # below keep the toolchain deterministic.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # v4 is the currently supported major; it installs the SDK and the
        # exact packages requested here. Do not rely on whatever the runner
        # image happens to preinstall (that is what broke run #1 and #2).
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Ensure Gradle wrapper is available
        # Defensive: regenerate wrapper files with the version pinned in
        # gradle-wrapper.properties in case the wrapper jar is ever missing.
        run: gradle wrapper --gradle-version 8.11.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK is not empty
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Inspect APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | head -n 40

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qr-payment-queue-v0.9.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
